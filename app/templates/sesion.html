{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block clase %}pagina-login{% endblock %}
{% block body %}
<main class="portada">
    <section class="portada-texto">
        <img class="portada-logo" src="{{ url_for('static', filename='i/6.png') }}">
    </section>

    <section class="s-tarjeta">
        <div class="s-icono"><img class="iconoimg" src="{{ url_for('static', filename='i/1.1.png') }}" alt="Gato"></div>
        <h2>Iniciar sesión</h2>


        <form id="sesion" method="post">
            <label class="campo">
                <img class="icono-img" src="{{ url_for('static', filename='i/gato.png') }}" alt="Usuario">
                <input type="text" name="usuario" id="usuario" placeholder="Usuario" required>
            </label>
            <label class="campo">
                <img class="icono-img" src="{{ url_for('static', filename='i/candado.png') }}" alt="Contraseña">
                <input type="password" name="contrasena" id="contrasena" placeholder="Contraseña" required>
            </label>
            <button type="submit" class="btn-e">Entrar</button>
        </form>
        <p class="p">¿No tienes cuenta? <a href="{{ url_for('registrar') }}">Regístrate</a></p>
    </section>
</main>
{% endblock %}
